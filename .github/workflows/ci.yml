name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, types, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

  inventory-guard:
    name: Order inventory lifecycle test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: inventory_guard_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d inventory_guard_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Create isolated test schema and lifecycle routines
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/inventory_guard_test
        run: psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/order_lifecycle_setup.sql

      - name: Install checkout RPC
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/inventory_guard_test
        run: psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/202610140002_secure_public_checkout.sql

      - name: Apply inventory fail-closed migration
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/inventory_guard_test
        run: psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/202610160003_require_inventory_record_before_order.sql

      - name: Apply legacy checkout RPC permission hardening
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/inventory_guard_test
        run: psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/202610160004_secure_legacy_checkout_rpc_permissions.sql

      - name: Test order, stock deduction, cancellation, and one-time return
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/inventory_guard_test
        run: psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/order_lifecycle.test.sql
